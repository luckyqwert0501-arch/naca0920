<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>報表 － 代購管理平台</title>
<link rel="stylesheet" href="style.css" />
<style>
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--aizome); }
  th.sortable .arrow{ opacity:.5; font-size:.7em; margin-left:3px; }
  @media print{ .print-only{ display:block !important; } #custWrap, #batchWrap{ display:block !important; } }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
ncBoot("reports.html", "報表", (el) => {
  const settings = DB.getSettings();
  const currentBatch = DB.listBatches().find(b => b.id === settings.currentBatchId);
  let scope = "current"; // "current" 當期 | "all" 累積
  let custSort = { key: "totalSpent", dir: "desc" };
  let batchSort = { key: "profit", dir: "desc" };
  let custExpanded = true;
  let batchExpanded = true;

  const CUST_COLS = [
    { key: "name", label: "姓名" },
    { key: "phone", label: "電話" },
    { key: "orderCount", label: "訂單數" },
    { key: "totalSpent", label: "消費總額" },
    { key: "totalProfit", label: "利潤" }
  ];
  const CUST_GETTERS = {
    name: r => r.customer.name || "", phone: r => r.customer.phone || "",
    orderCount: r => r.orderCount, totalSpent: r => r.totalSpent, totalProfit: r => r.totalProfit
  };
  const BATCH_COLS = [
    { key: "name", label: "期別" }, { key: "status", label: "狀態" },
    { key: "orderCount", label: "訂單數" }, { key: "revenue", label: "營收" },
    { key: "cogs", label: "進貨成本" }, { key: "tripCosts", label: "出差成本" }, { key: "profit", label: "淨利" }
  ];
  const BATCH_GETTERS = {
    name: r => r.batch.name || "", status: r => r.batch.status || "",
    orderCount: r => r.orderCount, revenue: r => r.revenue, cogs: r => r.cogs,
    tripCosts: r => r.tripCosts, profit: r => r.profit
  };

  function sortRows(rows, sort, getters) {
    const arr = rows.slice();
    const get = getters[sort.key];
    arr.sort((a, b) => {
      const va = get(a), vb = get(b);
      let cmp;
      if (typeof va === "string") cmp = va.localeCompare(vb, "zh-Hant");
      else cmp = va - vb;
      return sort.dir === "asc" ? cmp : -cmp;
    });
    return arr;
  }

  function headerRow(cols, sort) {
    return cols.map(c => `<th class="sortable" data-key="${c.key}">${c.label}${sort.key===c.key?`<span class="arrow">${sort.dir==="asc"?"▲":"▼"}</span>`:""}</th>`).join("");
  }

  function wireSort(theadEl, sortState, onChange) {
    theadEl.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        if (sortState.key === th.dataset.key) sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
        else { sortState.key = th.dataset.key; sortState.dir = "desc"; }
        onChange();
      });
    });
  }

  function render() {
    const batchIdFilter = scope === "current" && currentBatch ? currentBatch.id : null;
    const customerRows = sortRows(customerSummaries(batchIdFilter), custSort, CUST_GETTERS);
    const batchRowsRaw = scope === "current" && currentBatch
      ? [{ batch: currentBatch, orderCount: DB.listOrders(currentBatch.id).length, ...batchProfitSummary(currentBatch.id) }]
      : allBatchReports();
    const batchRows = sortRows(batchRowsRaw, batchSort, BATCH_GETTERS);

    el.innerHTML = `
      <div class="card no-print">
        <div class="row" style="align-items:center;">
          <div class="field" style="max-width:220px">
            <label>檢視範圍</label>
            <select id="scopeSelect">
              <option value="current" ${scope==="current"?"selected":""}>當期${currentBatch?"（"+currentBatch.name+"）":""}</option>
              <option value="all" ${scope==="all"?"selected":""}>累積（所有期別）</option>
            </select>
          </div>
          <div class="field" style="justify-content:flex-end"><button class="btn btn-ghost btn-small" id="printBtn">列印本頁報表</button></div>
        </div>
      </div>

      <div class="card print-sheet">
        <div class="row no-print" style="align-items:center; justify-content:space-between;">
          <h2 style="margin:0;">顧客消費／利潤${scope==="current"?"（當期）":"（所有期別加總）"}</h2>
          <button class="btn btn-ghost btn-small" id="custToggleBtn">${custExpanded ? "收合 ▲" : "展開 ▼"}</button>
        </div>
        <h2 class="print-only" style="display:none;">顧客消費／利潤${scope==="current"?"（當期）":"（所有期別加總）"}</h2>
        <div id="custWrap" style="${custExpanded ? "" : "display:none;"}">
          <p class="hint">點欄位標題可以排序。</p>
          <div class="grid-wrap">
            <table class="data-table">
              <thead><tr id="custHead">${headerRow(CUST_COLS, custSort)}</tr></thead>
              <tbody>
                ${customerRows.length ? customerRows.map(r => `
                  <tr>
                    <td>${r.customer.name}</td>
                    <td>${r.customer.phone}</td>
                    <td>${r.orderCount}</td>
                    <td>${ncFmt(r.totalSpent)}</td>
                    <td style="color:${r.totalProfit>=0?'var(--matcha)':'var(--danger)'}">${ncFmt(r.totalProfit)}</td>
                  </tr>`).join("") : `<tr><td colspan="5" style="color:var(--ink-soft)">尚無資料</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card print-sheet">
        <div class="row no-print" style="align-items:center; justify-content:space-between;">
          <h2 style="margin:0;">期別損益總覽${scope==="current"?"（當期）":"（本期＋過去）"}</h2>
          <button class="btn btn-ghost btn-small" id="batchToggleBtn">${batchExpanded ? "收合 ▲" : "展開 ▼"}</button>
        </div>
        <h2 class="print-only" style="display:none;">期別損益總覽${scope==="current"?"（當期）":"（本期＋過去）"}</h2>
        <div id="batchWrap" style="${batchExpanded ? "" : "display:none;"}">
          <p class="hint">點欄位標題可以排序。</p>
          <div class="grid-wrap">
            <table class="data-table">
              <thead><tr id="batchHead">${headerRow(BATCH_COLS, batchSort)}</tr></thead>
              <tbody>
                ${batchRows.length ? batchRows.map(r => `
                  <tr>
                    <td>${r.batch.name}</td>
                    <td>${r.batch.status||""}</td>
                    <td>${r.orderCount}</td>
                    <td>${ncFmt(r.revenue)}</td>
                    <td>${ncFmt(r.cogs)}</td>
                    <td>${ncFmt(r.tripCosts)}</td>
                    <td style="color:${r.profit>=0?'var(--matcha)':'var(--danger)'}; font-weight:600;">${ncFmt(r.profit)}</td>
                  </tr>`).join("") : `<tr><td colspan="7" style="color:var(--ink-soft)">尚無資料</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;

    document.getElementById("scopeSelect").addEventListener("change", e => { scope = e.target.value; render(); });
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    wireSort(document.getElementById("custHead"), custSort, render);
    wireSort(document.getElementById("batchHead"), batchSort, render);
    document.getElementById("custToggleBtn").addEventListener("click", () => {
      custExpanded = !custExpanded;
      document.getElementById("custWrap").style.display = custExpanded ? "" : "none";
      document.getElementById("custToggleBtn").textContent = custExpanded ? "收合 ▲" : "展開 ▼";
    });
    document.getElementById("batchToggleBtn").addEventListener("click", () => {
      batchExpanded = !batchExpanded;
      document.getElementById("batchWrap").style.display = batchExpanded ? "" : "none";
      document.getElementById("batchToggleBtn").textContent = batchExpanded ? "收合 ▲" : "展開 ▼";
    });
  }

  render();
});
</script>
</body>
</html>
